name = "monitorping-comunidad"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "monitorping-comunidad"
database_id = "331914d9-145d-42fa-bf31-970da3a12e95"

# 3 publicaciones por minuto por conexión (la IP solo se usa al vuelo, no se guarda)
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[triggers]
crons = ["0 9 * * *"] # limpieza diaria (09:00 UTC)
